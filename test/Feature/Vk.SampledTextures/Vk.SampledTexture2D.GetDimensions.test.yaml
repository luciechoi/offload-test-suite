#--- source.hlsl
[[vk::binding(0, 0)]] vk::SampledTexture2D<float4> CombinedTex1 : register(s0);
[[vk::binding(1, 0)]] vk::SampledTexture2D<float4> CombinedTex2 : register(s1);
[[vk::binding(3, 0)]] vk::SampledTexture2D<float4> CombinedTex3 : register(s2);
[[vk::binding(2, 0)]] RWBuffer<float> Out : register(u0);

[numthreads(1, 1, 1)]
void main() {
  float width, height, levels;

  CombinedTex1.GetDimensions(0, width, height, levels);
  Out[0] = width;
  Out[1] = height;
  Out[2] = levels;

  float w, h;
  CombinedTex1.GetDimensions(w, h);
  Out[3] = w;
  Out[4] = h;

  CombinedTex2.GetDimensions(0, width, height, levels);
  Out[5] = width;
  Out[6] = height;
  Out[7] = levels;

  CombinedTex2.GetDimensions(w, h);
  Out[8] = w;
  Out[9] = h;

  CombinedTex3.GetDimensions(0, width, height, levels);
  Out[10] = width;
  Out[11] = height;
  Out[12] = levels;
}

//--- pipeline.yaml
---
Shaders:
  - Stage: Compute
    Entry: main
    DispatchSize: [1, 1, 1]

Buffers:
  - Name: Tex1
    Format: Float32
    Channels: 4
    OutputProps: { Width: 4, Height: 8, Depth: 1 }
    FillSize: 512

  - Name: Tex2
    Format: Float32
    Channels: 4
    OutputProps: { Width: 16, Height: 32, Depth: 1 }
    FillSize: 8192

  - Name: Tex3
    Format: Float32
    Channels: 4
    OutputProps: { Width: 4, Height: 4, Depth: 1, MipLevels: 3 }
    FillSize: 336

  - Name: Out
    Format: Float32
    Channels: 1
    FillSize: 52

  - Name: Expected
    Format: Float32
    Channels: 1
    Data: [ 4.0, 8.0, 1.0, 4.0, 8.0,
            16.0, 32.0, 1.0, 16.0, 32.0,
            4.0, 4.0, 3.0 ]

Samplers:
  - Name: Samp
    MinFilter: Nearest
    MagFilter: Nearest
    Address: Clamp

CombinedImageSamplers:
  - Name: CombinedTex1
    Texture: Tex1
    TextureKind: Texture2D
    Sampler: Samp
  - Name: CombinedTex2
    Texture: Tex2
    TextureKind: Texture2D
    Sampler: Samp
  - Name: CombinedTex3
    Texture: Tex3
    TextureKind: Texture2D
    Sampler: Samp

DescriptorSets:
  - Resources:
    - Name: CombinedTex1
      Kind: CombinedImageSampler
      DirectXBinding: { Register: 0, Space: 0 }
      VulkanBinding: { Binding: 0 }
    - Name: CombinedTex2
      Kind: CombinedImageSampler
      DirectXBinding: { Register: 1, Space: 0 }
      VulkanBinding: { Binding: 1 }
    - Name: CombinedTex3
      Kind: CombinedImageSampler
      DirectXBinding: { Register: 2, Space: 0 }
      VulkanBinding: { Binding: 3 }
    - Name: Out
      Kind: RWBuffer
      DirectXBinding: { Register: 0, Space: 0 }
      VulkanBinding: { Binding: 2 }

Results:
  - Result: GetDimensionsTest
    Rule: BufferExact
    Actual: Out
    Expected: Expected
...
#--- end

