#--- source.hlsl
struct VSInput {
  float3 Pos : POSITION;
};

struct VSOutput {
  float4 Pos : SV_POSITION;
};

VSOutput mainVS(VSInput input) {
  VSOutput output;
  output.Pos = float4(input.Pos, 1.0f);
  return output;
}

[[vk::binding(0, 0)]] vk::SampledTexture2D<float4> CombinedSamp : register(s0);
[[vk::binding(1, 0)]] RWBuffer<float> Out : register(u0);

float4 mainPS(VSOutput input) : SV_Target {
  uint2 GTid = (uint2)input.Pos.xy;
  float2 uv0 = 0.25 + float2(GTid.xy) * 0.5;
  float2 uv1 = 0.25 + float2(GTid.xy) * 2.0;

  float lod0 = CombinedSamp.CalculateLevelOfDetail(uv0);
  float lod1 = CombinedSamp.CalculateLevelOfDetail(uv1);
  float lod2 = CombinedSamp.CalculateLevelOfDetailUnclamped(uv0);
  float lod3 = CombinedSamp.CalculateLevelOfDetailUnclamped(uv1);

  if (all(GTid.xy == 0)) {
    Out[0] = lod0;
    Out[1] = lod1;
    Out[2] = lod2;
    Out[3] = lod3;
  }
  return float4(0, 0, 0, 0);
}

#--- pipeline.yaml
---
Shaders:
  - Stage: Vertex
    Entry: mainVS
  - Stage: Pixel
    Entry: mainPS

Buffers:
  - Name: Tex
    Format: Float32
    Channels: 4
    OutputProps: { Width: 4, Height: 4, Depth: 1, MipLevels: 3 }
    FillSize: 336

  - Name: Out
    Format: Float32
    Channels: 1
    FillSize: 16

  - Name: Expected
    Format: Float32
    Channels: 1
    Data: [ 1.0, 2.0, 1.0, 3.0 ]

  - Name: RT
    Format: Float32
    Channels: 4
    FillSize: 64
    OutputProps: { Width: 2, Height: 2, Depth: 1 }

  - Name: VB
    Format: Float32
    Channels: 3
    Data: [-1.0, -1.0, 0.0,
            3.0, -1.0, 0.0,
           -1.0,  3.0, 0.0]

Bindings:
  VertexBuffer: VB
  VertexAttributes:
    - Format: Float32
      Channels: 3
      Offset: 0
      Name: POSITION
  RenderTarget: RT

Samplers:
  - Name: Samp
    MinFilter: Linear
    MagFilter: Linear
    Address: Clamp

CombinedImageSamplers:
  - Name: CombinedSamp
    Texture: Tex
    TextureKind: Texture2D
    Sampler: Samp

DescriptorSets:
  - Resources:
    - Name: CombinedSamp
      Kind: CombinedImageSampler
      DirectXBinding: { Register: 0, Space: 0 }
      VulkanBinding: { Binding: 0 }
    - Name: Out
      Kind: RWBuffer
      DirectXBinding: { Register: 0, Space: 0 }
      VulkanBinding: { Binding: 1 }

Results:
  - Result: LODTest
    Rule: BufferFloatULP
    Actual: Out
    Expected: Expected
    ULPT: 1
...
#--- end

# Unimplemented: This is a Vulkan specific feature.
# UNSUPPORTED: !Vulkan

# RUN: split-file %s %t
# RUN: %dxc_target -T vs_6_6 -E mainVS -Fo %t-vs.o %t/source.hlsl
# RUN: %dxc_target -T ps_6_6 -E mainPS -Fo %t-ps.o %t/source.hlsl
# RUN: %offloader %t/pipeline.yaml %t-vs.o %t-ps.o
